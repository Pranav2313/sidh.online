<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIDH</title>

<link rel="icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:#000;
    color:#fff;
    display:flex;
}

/* ===========================
   SIDEBAR
=========================== */

.sidebar{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    width:260px;
}

.profile-card{
    position:relative;
}

.profile{
    width:100%;
    display:block;
    border-radius:22px;
}

.profile-overlay{
    position:absolute;
    left:18px;
    bottom:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.profile-overlay a{
    text-decoration:none;
    color:#c93a3a;
    font-family:'Bree Serif',serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:1px;
    transition:.3s;
}

.profile-overlay a:hover{
    color:white;
}

/* ===========================
   MAIN
=========================== */

.main{
    margin-left:360px;
    width:100%;
    padding:60px;
}

.heading{
    font-size:72px;
    font-weight:800;
    margin-bottom:12px;
}

.subtitle{
    color:#888;
    font-size:20px;
    margin-bottom:45px;
}

/* ===========================
   CATEGORY GRID
=========================== */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
}

.folder-card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    height:270px;
    text-decoration:none;
    color:white;
    border:1px solid #202020;
    transition:.35s ease;
    background:#111;
}

.folder-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
    opacity:.45;
}

.folder-card:hover img{
    transform:scale(1.08);
    opacity:.7;
}

.folder-card:hover{
    transform:translateY(-8px);
    border-color:#c93a3a;
    box-shadow:0 15px 35px rgba(201,58,58,.18);
}

.folder-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    padding:28px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.88)
    );
}

.folder-title{
    font-size:34px;
    font-weight:800;
}

/* ===========================
   CONTACT
=========================== */

.contact{
    padding:110px 0 50px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.contact h2{
    font-size:70px;
    margin-bottom:18px;
}

.contact p{
    color:#999;
    font-size:22px;
    margin-bottom:35px;
}

.contact-info{
    display:flex;
    flex-direction:column;
    gap:20px;
    font-size:22px;
}

.contact-info div,
.contact-info a{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    color:white;
    text-decoration:none;
}

.contact-info a:hover{
    color:#c93a3a;
}

.contact-info i{
    color:#c93a3a;
    width:28px;
}

/* ===========================
   AVAILABLE BADGE
=========================== */

.badge{
    margin-top:40px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 30px;
    border:1px solid #333;
    border-radius:999px;
    font-weight:600;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 0 0 rgba(34,197,94,.8);
    }

    70%{
        box-shadow:0 0 0 12px rgba(34,197,94,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(34,197,94,0);
    }

}

/* ===========================
   FOOTER
=========================== */

.footer-line{
    width:100%;
    max-width:700px;
    margin:80px auto 25px;
    border:none;
    height:1px;
    background:linear-gradient(
        to right,
        transparent,
        #333,
        transparent
    );
}

.copyright{
    color:#666;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    text-align:center;
}

/* ===========================
   MOBILE
=========================== */

@media(max-width:900px){

body{
    display:block;
}

.sidebar{
    position:relative;
    top:auto;
    left:auto;
    transform:none;
    width:85%;
    margin:25px auto;
}

.main{
    margin-left:0;
    padding:25px;
}

.heading{
    font-size:48px;
    text-align:center;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
}

.grid{
    grid-template-columns:1fr;
    gap:22px;
}

.folder-card{
    height:230px;
}

.folder-title{
    font-size:28px;
}

.contact{
    padding-top:80px;
}

.contact h2{
    font-size:48px;
}

.contact-info{
    font-size:18px;
}

.badge{
    font-size:15px;
}

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="profile-card">

        <img src="image.png" class="profile">

        <div class="profile-overlay">
            <a href="#works">WORKS</a>
            <a href="#contact">CONTACT</a>
        </div>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <!-- WORKS -->

    <section id="works">

        <h1 class="heading">WORKS</h1>

        <p class="subtitle">
            Explore my portfolio by category.
        </p>

        <div class="grid">

            <!-- META ADS -->

            <a href="meta-ads/" class="folder-card">

                <img src="favicon.png">

                <div class="folder-overlay">

                    <div class="folder-title">
                        Meta Ads
                    </div>

                </div>

            </a>

           <!-- MOGRAPH -->

            <a href="mograph/" class="folder-card">

                <img src="favicon.png">

                <div class="folder-overlay">

                    <div class="folder-title">
                        Mograph
                    </div>

                </div>

            </a>

            <!-- PODCAST SHORTS -->

            <a href="podcast-shorts/" class="folder-card">

                <img src="favicon.png">

                <div class="folder-overlay">

                    <div class="folder-title">
                        Podcast Shorts
                    </div>

                </div>

            </a>

            <!-- CREATIVES -->

            <a href="creatives/" class="folder-card">

                <img src="favicon.png">

                <div class="folder-overlay">

                    <div class="folder-title">
                        Creatives
                    </div>

                </div>

            </a>

        </div>

    </section>



    <!-- CONTACT -->

    <section id="contact" class="contact">

        <h2>CONTACT ME</h2>

        <p>Video Editor & DOP</p>

        <div class="contact-info">

            <div>
                <i class="fa-solid fa-envelope"></i>
                editsofsid@gmail.com
            </div>

            <a href="https://www.instagram.com/kukku5id/" target="_blank">
                <i class="fa-brands fa-instagram"></i>
                @kukku5id
            </a>

            <div>
                <i class="fa-solid fa-location-dot"></i>
                Kochi, India
            </div>

        </div>

        <div class="badge">

            <span class="status-dot"></span>

            AVAILABLE FOR PROJECTS

        </div>

        <hr class="footer-line">

        <div class="copyright">
            © 2026 SIDH. Crafted with passion by Sidharth Raj.
        </div>

    </section>

</div>

</body>
</html>
