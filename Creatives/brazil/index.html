<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brazil | SIDH</title>

<link rel="icon" href="../../icon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:'Inter',sans-serif;
}

.container{
max-width:1500px;
margin:auto;
padding:40px 25px 70px;
}

.back{
display:inline-block;
margin-bottom:35px;
text-decoration:none;
color:#c93a3a;
font-weight:600;
font-size:18px;
transition:.3s;
}

.back:hover{
color:#fff;
}

.page-title{
text-align:center;
font-size:64px;
font-weight:800;
margin-bottom:60px;
}

.section{
margin-bottom:80px;
}

.section h2{
font-size:34px;
margin-bottom:25px;
font-weight:700;
text-align:center;
}

.video-box{
display:flex;
justify-content:center;
}

.video-box video{
width:100%;
max-width:1300px;
max-height:80vh;
border-radius:20px;
background:#111;
box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.divider{
margin:70px auto;
width:80%;
height:1px;
background:#222;
}

@media(max-width:900px){

.container{
padding:20px 15px 40px;
}

.page-title{
font-size:40px;
margin-bottom:40px;
}

.section{
margin-bottom:50px;
}

.section h2{
font-size:26px;
}

.video-box video{
max-height:70vh;
border-radius:15px;
}

}

</style>

</head>

<body>

<div class="container">

<a href="../" class="back">
← Back to Mograph
</a>

<h1 class="page-title">
Brazil
</h1>

<!-- REEL -->

<div class="section">


<div class="video-box">

<video controls controlsList="nodownload">

<source src="Ep 08.mp4" type="video/mp4">

</video>

</div>

</div>

<div class="divider"></div>


</div>

</body>
</html>
